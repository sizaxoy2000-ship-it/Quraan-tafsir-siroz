<!DOCTYPE html>
<html lang="ar">
<head>
    <!-- في ملف تفسير القرآن -->

    <title>سيروز تفسير القرآن | Siroz Tefsir Quraan</title>
    <meta name="description" content="استكشف تفسير القرآن الكريم عبر منصة سيروز الرقمية - Siroz Tefsir Quraan">
    <meta name="keywords" content="تفسير القرآن, سيروز, Siroz Tefsir, القرآن الكريم, بصمة جوجل">

    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siroz Quran - سيروز</title>
    <meta name="theme-color" content="#02091a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="https://i.ibb.co/B56sM9HR/IMG-20260322-202243.png">
    
        <meta name="description" content="Siroz Quran - تطبيق سيروز للقرآن الكريم مع التفسير الميسر والكردي والإنجليزي.">
    <meta name="keywords" content="Siroz, Quran, زاخو, Zakho, قرآن">
    <meta name="google-site-verification" content="W2isoxEHMosEMdJhazf7Sr4M53nxrfkVeqJE_Z3u01U" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3144047456957450" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #ffbf00; --bg: #02091a; --text-ayah: #ffbf00; --text-trans: #ffffff; 
            --text-ui: #ffffff; --card: rgba(255, 255, 255, 0.08); --quran-font: 'Amiri Quran', serif; 
        }
        .light-theme { 
            --bg: #ffffff; --text-ayah: #000000; --text-trans: #000000; 
            --text-ui: #000000; --card: rgba(0, 0, 0, 0.05); 
        }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; color: var(--text-ui); background: var(--bg); height: 100vh; overflow: hidden; transition: 0.3s; }
        .overlay { background: var(--bg); height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; }
        .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; padding: 5px 10px; z-index: 10; }
        .icon-btn { background: var(--card); border: 1px solid var(--gold); color: var(--text-ui); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .scroll-area { flex: 1; width: 100%; max-width: 600px; overflow-y: auto; padding: 10px; scroll-behavior: smooth; }
        .page { display: none; width: 100%; text-align: center; }
        .active { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-main { background: var(--gold); color: black; border: none; padding: 12px; margin: 8px auto; border-radius: 50px; font-weight: bold; width: 85%; font-size: 1rem; cursor: pointer; display: block; }
        .btn-last { background: #2ecc71; color: white; border: none; padding: 10px; margin: 5px auto; border-radius: 50px; width: 75%; cursor: pointer; font-weight: bold; display: none; border: 1.5px solid white; font-size: 0.8rem; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
        .card-btn { background: var(--card); border: 1px solid var(--gold); color: var(--text-ui); padding: 12px 5px; border-radius: 10px; cursor: pointer; font-size: 0.85rem; }
        .search-box { width: 85%; background: var(--card); border: 1.5px solid var(--gold); border-radius: 50px; padding: 10px; color: var(--text-ui); margin: 10px auto; text-align: center; outline: none; display: block; font-size: 0.9rem; }
        .ayah-container { background: var(--card); padding: 18px; border-radius: 12px; margin-bottom: 12px; border-right: 3px solid var(--gold); text-align: right; }
        .quran-text { font-family: var(--quran-font); font-size: 1.45rem; line-height: 2.2; color: var(--text-ayah); display: block; direction: rtl; }
        .translation-text { font-size: 0.95rem; color: var(--text-trans); opacity: 0.9; display: block; margin-top: 10px; font-style: italic; }
        .back-btn { background: #333; color: white; border: none; padding: 10px 30px; border-radius: 50px; cursor: pointer; margin: 15px 0; font-size: 0.9rem; }
        .footer { padding: 8px; font-size: 0.75rem; color: #888; }
   .footer-link {
    text-align: center;
    padding: 20px 0;
    margin-top: 40px;
    border-top: 1px solid rgba(255, 255, 255, 0.1); /* خط نحيف جداً للفصل */
}

.footer-link p {
    color: #888; /* لون رمادي هادئ */
    font-size: 14px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.footer-link {
    text-align: center;
    padding: 15px 0;
    width: 100%;
    background: #02091a; /* نفس لون الخلفية */
    border-top: 1px solid #333; /* خط نحيف جداً ليفصله عن الأزرار */
    margin-top: 20px; 
    display: block !important; /* إجبار المتصفح على إظهاره */
        }        
    </style>
</head>
<body>
<div class="overlay">
    <div class="top-bar">
        <button class="icon-btn" onclick="toggleTheme()">🌓 Theme</button>
        <button class="icon-btn" onclick="toggleLang()">🌐 Language</button>
    </div>

    <div class="scroll-area" id="mainScroll">
        <div id="pHome" class="page active">
            <img src="https://i.ibb.co/B56sM9HR/IMG-20260322-202243.png" style="width: 80px; border-radius: 50%; margin-top: 10px;">
            <h2 style="color: var(--gold); margin: 10px 0;">Siroz Quran</h2>
            <button id="btnLastRead" class="btn-last" onclick="goToLastRead()">استئناف القراءة 📖</button>
            <button class="btn-main" id="btnAr" onclick="startApp('ar')">تفسير سيروز (بالعربية)</button>
            <button class="btn-main" id="btnKu" onclick="startApp('sorani')">تەفسیری کوردی (سۆراني)</button>
            <button class="btn-main" id="btnOnly" onclick="startApp('ar_only')">القرآن الكريم (رسم عثماني)</button>
            <button class="btn-main" id="btnEn" onclick="startApp('en')">English Translation</button>
        </div>

        <div id="pIndex" class="page">
            <h3 id="idxTitle" style="color: var(--gold);"></h3>
            <input type="text" id="sInput" class="search-box" oninput="searchS()">
            <div class="grid" id="sGrid"></div>
            <button class="back-btn" id="btnHome" onclick="goBackDirectly()">العودة للبداية</button>
        </div>

        <div id="pRead" class="page">
            <h3 id="surahName" style="color: var(--gold);"></h3>
            <input type="text" id="aInput" class="search-box" oninput="searchA()">
            <div id="aList"></div>
            <button class="back-btn" id="btnIdx" onclick="goBackDirectly()">فهرس السور</button>
        </div>
    </div>
    <div class="footer"><b>By Siroz: Zakho</b></div>
</div>

<script>
    let mode = 'ar'; let uiLang = 'ar';
    const sNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البيّنة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
    const scrollArea = document.getElementById('mainScroll');

    const texts = {
        ar: { last: "استئناف القراءة 📖", ar: "تفسير سيروز (بالعربية)", ku: "تەفسيری کوردی (سۆراني)", only: "القرآن الكريم", en: "English Translation", searchS: "ابحث عن سورة...", searchA: "ابحث عن كلمة...", backH: "العودة للبداية", backI: "فهرس السور", load: "جاري التحميل...", idx: "فهرس السور" },
        en: { last: "Resume Reading 📖", ar: "Siroz Tafsir (Arabic)", ku: "Kurdish Tafsir", only: "Quran Arabic Only", en: "English Translation", searchS: "Search Surah...", searchA: "Search word...", backH: "Back Home", backI: "Surah Index", load: "Loading...", idx: "Surah Index" },
        sorani: { last: "بەردەوامبوون لە خوێندنەوە 📖", ar: "تەفسیری سيرۆز (عەرەبي)", ku: "تەفسیری کوردی (سۆراني)", only: "قورئانی پیرۆز", en: "وەرگێڕانی ئینگلیزي", searchS: "گەڕان بۆ سورەت...", searchA: "گەڕان بۆ وشە...", backH: "گەڕانەوە بۆ سەرەتا", backI: "فهرستي سورەتەکان", load: "باردەکرێت...", idx: "فهرستي سورەتەکان" }
    };

    function showP(id, push = true) {
        if (push) history.pushState({p: id}, null, "");
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(id);
        if (target) target.classList.add('active');
        
        document.getElementById('sInput').value = ""; 
        document.getElementById('aInput').value = "";
        renderS(sNames); 
        if (id !== 'pRead') scrollArea.scrollTop = 0;
        checkLastRead();
    }

    window.onpopstate = (e) => {
        const page = (e.state && e.state.p) ? e.state.p : 'pHome';
        showP(page, false);
    };

    function goBackDirectly() { history.back(); }

    function toggleTheme() {
        document.body.classList.toggle('light-theme');
        localStorage.setItem('sirozTheme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
    }

    function toggleLang() {
        uiLang = (uiLang === 'ar') ? 'sorani' : (uiLang === 'sorani' ? 'en' : 'ar');
        updateUI();
    }

    function updateUI() {
        const t = texts[uiLang];
        document.body.dir = (uiLang === 'en') ? 'ltr' : 'rtl';
        document.getElementById('btnLastRead').innerText = t.last;
        document.getElementById('btnAr').innerText = t.ar;
        document.getElementById('btnKu').innerText = t.ku;
        document.getElementById('btnOnly').innerText = t.only;
        document.getElementById('btnEn').innerText = t.en;
        document.getElementById('sInput').placeholder = t.searchS;
        document.getElementById('aInput').placeholder = t.searchA;
        document.getElementById('btnHome').innerText = t.backH;
        document.getElementById('btnIdx').innerText = t.backI;
        document.getElementById('idxTitle').innerText = t.idx;
    }

    function startApp(l) { mode = l; showP('pIndex'); }

    function renderS(list) {
        const g = document.getElementById('sGrid'); g.innerHTML = "";
        sNames.forEach((n, i) => {
            if (list.includes(n)) {
                const b = document.createElement('button'); b.className = 'card-btn';
                b.innerHTML = `<small>${i+1}</small><br><b>${n}</b>`;
                b.onclick = () => loadS(i + 1, n);
                g.appendChild(b);
            }
        });
    }

    function searchS() {
        const q = document.getElementById('sInput').value.trim();
        const filtered = sNames.filter(n => n.includes(q) || (sNames.indexOf(n)+1).toString() === q);
        renderS(filtered);
    }

    function searchA() {
        const q = document.getElementById('aInput').value.trim();
        const containers = document.getElementsByClassName('ayah-container');
        for (let div of containers) div.style.display = div.innerText.includes(q) ? "block" : "none";
    }

    async function loadS(id, name, isResume = false) {
        localStorage.setItem('sirozLast', JSON.stringify({id, name, mode}));
        document.getElementById('surahName').innerText = name;
        const l = document.getElementById('aList');
        const cacheKey = `cached_${id}_${mode}`;
        
        if (localStorage.getItem(cacheKey)) {
            l.innerHTML = localStorage.getItem(cacheKey);
            showP('pRead');
            if (isResume) setTimeout(() => scrollArea.scrollTop = localStorage.getItem('sirozScrollPos'), 150);
            return;
        }

        l.innerHTML = `<h4>${texts[uiLang].load}</h4>`;
        showP('pRead');

        const map = { ar: "ar.muyassar", sorani: "ku.asan", en: "en.sahih", ar_only: "" };
        try {
            const rQ = await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);
            const dQ = await rQ.json();
            let dT = (mode !== 'ar_only') ? await (await fetch(`https://api.alquran.cloud/v1/surah/${id}/${map[mode]}`)).json() : null;

            let fullContent = "";
            dQ.data.ayahs.forEach((a, i) => {
                fullContent += `<div class="ayah-container">
                    <span class="quran-text">${a.text} <span style="color:var(--gold); font-size:1rem">﴿${i+1}﴾</span></span>` + 
                    (dT ? `<span class="translation-text">${dT.data.ayahs[i].text}</span>` : "") + 
                `</div>`;
            });
            localStorage.setItem(cacheKey, fullContent);
            l.innerHTML = fullContent;
        } catch (e) { l.innerHTML = "Error"; }
    }

    function checkLastRead() {
        const last = localStorage.getItem('sirozLast');
        document.getElementById('btnLastRead').style.display = last ? 'block' : 'none';
    }

    function goToLastRead() {
        const last = JSON.parse(localStorage.getItem('sirozLast'));
        if (last) { mode = last.mode; loadS(last.id, last.name, true); }
    }

    window.onload = () => {
        if (localStorage.getItem('sirozTheme') === 'light') document.body.classList.add('light-theme');
        updateUI();
        checkLastRead();
        history.replaceState({p: 'pHome'}, null, "");
        
        // تسجيل نظام الأوفلاين (Service Worker)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => {
                console.log("Siroz Offline Active!");
            }).catch(e => console.log(e));
        }
    };

    scrollArea.onscroll = () => {
        if (document.getElementById('pRead').classList.contains('active')) {
            localStorage.setItem('sirozScrollPos', scrollArea.scrollTop);
        }
    };
</script>
    <div style="text-align: center; padding: 30px 10px; position: relative; z-index: 9999; background: #02091a;">
    <p style="color: #ffffff !important; font-size: 16px; margin: 0; font-family: sans-serif;">
        See also: 
        <a href="https://github.io" style="color: #ffcc00 !important; font-weight: bold; text-decoration: underline;">
            Siroz Web
        </a>
    </p>
    </div>
    
    
</body>
</html>
